
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>입맛지도 | 내 주변 맛집 탐색</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#20242b;--muted:#7b8492;--line:#e7eaf0;--brand:#ff7043;--brand-dark:#e95b30;--brand-pale:#fff0ea;--shadow:0 8px 28px #1f29370b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:20px 22px 100px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:950;letter-spacing:-1.1px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--brand);color:white;font-size:21px;box-shadow:0 5px 14px #ff704333}
.brand em{color:var(--brand);font-style:normal}
.origin{display:flex;align-items:center;gap:7px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#4b5563;font-size:12px;font-weight:700}
.hero{padding:24px 0 20px}
.kicker{font-size:11px;letter-spacing:1.6px;font-weight:900;color:var(--brand-dark)}
h1{font-size:clamp(29px,5vw,43px);line-height:1.18;letter-spacing:-1.8px;margin:9px 0 10px}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.search-panel{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:17px;padding:8px 9px 8px 16px;box-shadow:var(--shadow)}
.search-symbol{font-size:21px;color:#8b95a4}
#searchInput{flex:1;min-width:0;border:0;outline:0;padding:11px 0;font-size:14px;color:var(--ink);background:transparent}
#searchInput::placeholder{color:#a3aab5}
.search-btn{border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;padding:12px 17px}
.quick-search{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}
.quick-search button,.filter-chip{border:1px solid var(--line);background:#fff;color:#56606e;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}
.quick-search button:hover,.filter-chip:hover{border-color:#ffb29a}
.main-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:12px 0 20px}
.main-tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:14px 17px;color:var(--muted);font-weight:850;margin-bottom:-1px}
.main-tab.active{color:var(--brand-dark);border-bottom-color:var(--brand)}
.content-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:sticky;top:14px}
.filter-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;font-weight:900;font-size:15px}
.reset{border:0;background:transparent;color:var(--brand-dark);font-size:12px;font-weight:800}
.filter-group{padding:15px 0;border-top:1px solid #f0f2f5}
.filter-group:first-of-type{border-top:0;padding-top:0}
.filter-title{font-size:12px;font-weight:900;margin-bottom:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.filter-chip{padding:8px 10px}
.filter-chip.active{background:var(--brand-pale);border-color:#ffc7b5;color:#c84c26}
.walk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.walk-btn{padding:10px 3px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#596273;font-size:12px;font-weight:800}
.walk-btn.active{border-color:var(--brand);background:var(--brand-pale);color:var(--brand-dark)}
.origin-note{font-size:11px;line-height:1.55;color:var(--muted);margin:12px 0 0}
.results-top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:1px 0 14px}
.results-top h2{font-size:20px;letter-spacing:-.6px;margin:0 0 5px}
.results-sub{font-size:12px;color:var(--muted)}
.sort-select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:12px;color:#596273;max-width:145px}
.status-strip{display:flex;align-items:flex-start;gap:9px;border:1px solid #f3e0d7;background:#fff8f4;color:#795949;padding:12px 13px;border-radius:13px;font-size:11px;line-height:1.6;margin-bottom:15px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:5px;flex:0 0 auto}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.place-card{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 3px 12px #1f293706;transition:transform .18s,box-shadow .18s}
.place-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 14px 0}
.category-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#fff0ea;font-size:22px}
.save-btn{border:1px solid var(--line);background:white;border-radius:50%;width:34px;height:34px;font-size:18px;color:#89919e}
.save-btn.saved{color:#ed5570;background:#fff1f3;border-color:#ffd6de}
.card-body{padding:12px 14px 14px}
.place-name{font-size:16px;letter-spacing:-.4px;font-weight:900;margin:0 0 6px}
.place-desc{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px;min-height:19px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{background:#f3f5f8;color:#657080;border-radius:6px;padding:5px 7px;font-size:10px;font-weight:750}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #f0f2f5;padding-top:11px}
.walk-label{font-size:11px;font-weight:800;color:#56606e}
.card-actions{display:flex;gap:6px}
.action-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 9px;color:#4d5664;font-size:11px;font-weight:800;background:white}
.action-link.primary{background:var(--brand);border-color:var(--brand);color:white}
.empty{grid-column:1/-1;text-align:center;padding:40px 18px;border:1px dashed #dce1e8;background:#fff;border-radius:16px;color:var(--muted);line-height:1.8}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1100px);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 12px calc(9px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;background:#ffffffed;backdrop-filter:blur(16px)}
.nav-btn{border:0;background:transparent;color:#8a929e;font-size:11px;font-weight:750;padding:5px}
.nav-btn span{display:block;font-size:20px;margin-bottom:3px}
.nav-btn.active{color:var(--brand-dark)}
.hidden{display:none!important}
@media(min-width:760px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding-top:30px}.app{padding-top:26px}}
@media(max-width:680px){.app{padding:14px 14px 92px}.content-layout{grid-template-columns:1fr;gap:14px}.filters{position:static;padding:15px}.filter-group{padding:12px 0}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card-body{padding:10px}.card-top{padding:10px 10px 0}.place-name{font-size:14px}.place-desc{font-size:11px}.card-actions{gap:4px}.action-link{padding:7px 7px;font-size:10px}.origin{font-size:10px;padding:9px}.hero{padding-top:20px}.search-btn{padding:11px 12px}.results-top h2{font-size:18px}}
@media(max-width:390px){.results{grid-template-columns:1fr}.main-tab{padding:12px 13px}.origin{max-width:165px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-mark">⌁</span><span>입맛<em>지도</em></span></div>
    <div class="origin">📍 동아백화점 쇼핑점 기준</div>
  </header>

  <section class="hero">
    <div class="kicker">FIND YOUR NEXT FAVORITE</div>
    <h1>오늘 어디서<br>뭐 먹지?</h1>
    <p>취향에 맞는 장소를 빠르게 찾고,<br>마음에 드는 곳은 저장해 둬.</p>
  </section>

  <form class="search-panel" id="searchForm">
    <span class="search-symbol">⌕</span>
    <input id="searchInput" type="search" placeholder="가게명, 메뉴, 키워드 검색" autocomplete="off">
    <button class="search-btn" type="submit">검색</button>
  </form>
  <div class="quick-search" aria-label="빠른 검색">
    <button type="button" data-query="국밥"># 국밥</button>
    <button type="button" data-query="마라"># 마라</button>
    <button type="button" data-query="돈까스"># 돈까스</button>
    <button type="button" data-query="파스타"># 파스타</button>
    <button type="button" data-query="디저트"># 디저트</button>
    <button type="button" data-query="커피"># 커피</button>
  </div>

  <nav class="main-tabs" aria-label="장소 유형">
    <button class="main-tab active" type="button" data-kind="food">🍽️ 음식점</button>
    <button class="main-tab" type="button" data-kind="cafe">☕ 카페</button>
  </nav>

  <div class="content-layout">
    <aside class="filters">
      <div class="filter-heading"><span>필터</span><button class="reset" id="resetFilters" type="button">초기화</button></div>
      <section class="filter-group">
        <div class="filter-title">어떤 느낌이 당겨?</div>
        <div class="chips" id="foodFilters">
          <button class="filter-chip active" type="button" data-filter="taste" data-value="all">전체</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="매운맛">🌶️ 매운맛</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="국물">🍲 국물</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="든든함">🍚 든든함</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="바삭함">🍗 바삭함</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="단짠단짠">🍯 단짠단짠</button>
          <button class="filter-chip" type="button" data-filter="taste" data-value="새콤달콤">🍋 새콤달콤</button>
        </div>
        <div class="chips hidden" id="cafeFilters">
          <button class="filter-chip active" type="button" data-filter="cafeType" data-value="all">전체</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="디저트">🍰 디저트</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="분위기">🌿 분위기</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="음료">☕ 음료</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="베이커리">🥐 베이커리</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="조용함">🤫 조용함</button>
          <button class="filter-chip" type="button" data-filter="cafeType" data-value="데이트">💑 데이트</button>
        </div>
      </section>
      <section class="filter-group">
        <div class="filter-title">도보 거리</div>
        <div class="walk-grid">
          <button class="walk-btn active" type="button" data-walk="10">10분 이내</button>
          <button class="walk-btn" type="button" data-walk="20">20분 이내</button>
          <button class="walk-btn" type="button" data-walk="30">30분 이내</button>
        </div>
        <p class="origin-note">출발점: 동아백화점 쇼핑점<br>※ 실제 도보 시간은 경로 API 연결 후 계산돼.</p>
      </section>
      <section class="filter-group">
        <div class="filter-title">정렬</div>
        <select id="sortSelect" class="sort-select" style="width:100%">
          <option value="recommended">추천순</option>
          <option value="name">가게명순</option>
          <option value="walk">가까운 순 (예시 시간 기준)</option>
        </select>
      </section>
    </aside>

    <main>
      <div class="results-top">
        <div><h2 id="resultsTitle">음식점 둘러보기</h2><div class="results-sub" id="resultSummary">조건에 맞는 장소를 찾아볼게.</div></div>
        <select id="viewMode" class="sort-select" aria-label="표시 방식">
          <option value="grid">카드 보기</option>
          <option value="compact">간단히 보기</option>
        </select>
      </div>
      <div class="status-strip"><span class="status-dot"></span><span id="statusText">현재는 UI 시연용 예시 데이터야. 실제 장소 검색 API를 연결하면 실제 장소 결과로 교체할 수 있어.</span></div>
      <section class="results" id="results" aria-live="polite"></section>
    </main>
  </div>
</div>

<nav class="bottom-nav" aria-label="하단 메뉴">
  <button class="nav-btn active" type="button" data-page="home"><span>⌂</span>탐색</button>
  <button class="nav-btn" type="button" data-page="saved"><span>♡</span>찜 목록</button>
  <button class="nav-btn" type="button" data-page="random"><span>⤨</span>랜덤 추천</button>
</nav>

<script>
const demoPlaces = [
{id:"f1",kind:"food",name:"얼큰한 국밥집",desc:"뜨끈한 국물로 든든하게",icon:"🍲",tags:["국물","든든함"],walk:8,query:"국밥"},
{id:"f2",kind:"food",name:"매콤한 마라 전문점",desc:"얼얼하고 매콤한 한 끼",icon:"🌶️",tags:["매운맛","국물"],walk:12,query:"마라"},
{id:"f3",kind:"food",name:"바삭한 돈까스",desc:"겉은 바삭하고 속은 촉촉하게",icon:"🍛",tags:["바삭함","든든함"],walk:16,query:"돈까스"},
{id:"f4",kind:"food",name:"달콤짭짤 덮밥",desc:"한 그릇으로 간편하게",icon:"🍚",tags:["단짠단짠","든든함"],walk:21,query:"덮밥"},
{id:"f5",kind:"food",name:"새콤한 파스타",desc:"산뜻한 소스와 풍성한 토핑",icon:"🍝",tags:["새콤달콤","든든함"],walk:25,query:"파스타"},
{id:"c1",kind:"cafe",name:"케이크 디저트 카페",desc:"달콤한 케이크와 커피 한 잔",icon:"🍰",tags:["디저트","데이트","분위기"],walk:7,query:"케이크"},
{id:"c2",kind:"cafe",name:"감성 베이커리 카페",desc:"빵 굽는 향이 좋은 공간",icon:"🥐",tags:["베이커리","분위기"],walk:14,query:"베이커리"},
{id:"c3",kind:"cafe",name:"조용한 커피 카페",desc:"차분하게 쉬어가기 좋은 곳",icon:"☕",tags:["음료","조용함"],walk:18,query:"커피"},
{id:"c4",kind:"cafe",name:"데이트 디저트 카페",desc:"대화하기 좋은 아늑한 분위기",icon:"🧁",tags:["디저트","데이트"],walk:24,query:"디저트"}
];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let kind="food", taste="all", cafeType="all", walkLimit=10, page="home", query="", sort="recommended", compact=false;
let saved=[];
try{saved=JSON.parse(localStorage.getItem("ipmat-saved-v2")||"[]");if(!Array.isArray(saved))saved=[];}catch(e){saved=[]}
function setActive(selector,attr,value){$$(selector).forEach(b=>b.classList.toggle("active",b.getAttribute(attr)===String(value)))}
function filtered(){
 let list=demoPlaces.filter(p=>p.kind===kind);
 const activeTag=kind==="food"?taste:cafeType;
 if(activeTag!=="all")list=list.filter(p=>p.tags.includes(activeTag));
 list=list.filter(p=>p.walk<=walkLimit);
 if(query.trim()){const q=query.trim().toLocaleLowerCase("ko-KR");list=list.filter(p=>[p.name,p.desc,p.query,...p.tags].join(" ").toLocaleLowerCase("ko-KR").includes(q))}
 if(page==="saved")list=list.filter(p=>saved.includes(p.id));
 if(sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
 if(sort==="walk")list.sort((a,b)=>a.walk-b.walk);
 return list;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 $("#foodFilters").classList.toggle("hidden",kind!=="food");
 $("#cafeFilters").classList.toggle("hidden",kind!=="cafe");
 $$(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.kind===kind));
 $("#resultsTitle").textContent=page==="saved"?"내가 찜한 장소":page==="random"?"랜덤 추천":kind==="food"?"음식점 둘러보기":"카페 둘러보기";
 let list=filtered();
 if(page==="random"&&list.length)list=[list[Math.floor(Math.random()*list.length)]];
 $("#resultSummary").textContent=`${list.length}개 장소 · ${walkLimit}분 이내 조건`;
 $("#statusText").textContent=query?`“${query}” 검색 · 현재 예시 데이터 안에서 검색 중`: "현재는 UI 시연용 예시 데이터야. 실제 장소 검색 API를 연결하면 실제 장소 결과로 교체할 수 있어.";
 const root=$("#results");
 root.classList.toggle("compact",compact);
 if(!list.length){root.innerHTML=`<div class="empty"><strong>조건에 맞는 장소가 없어.</strong>검색어나 필터를 바꿔 다시 찾아봐.</div>`;return}
 root.innerHTML=list.map(p=>`<article class="place-card">
 <div class="card-top"><div class="category-icon">${p.icon}</div><button type="button" class="save-btn ${saved.includes(p.id)?"saved":""}" data-save="${p.id}" aria-label="찜하기">${saved.includes(p.id)?"♥":"♡"}</button></div>
 <div class="card-body"><h3 class="place-name">${escapeHtml(p.name)}</h3><p class="place-desc">${escapeHtml(p.desc)}</p>
 <div class="card-tags">${p.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
 <div class="card-foot"><span class="walk-label">🚶 예시 ${p.walk}분</span><div class="card-actions"><a class="action-link" href="https://map.kakao.com/link/search/${encodeURIComponent(p.query)}" target="_blank" rel="noopener">지도 검색 ↗</a><a class="action-link primary" href="https://map.naver.com/p/search/${encodeURIComponent(p.query)}" target="_blank" rel="noopener">길찾기 ↗</a></div></div></div></article>`).join("");
}
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();query=$("#searchInput").value.trim();page="home";$$(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page==="home"));render()});
$("#searchInput").addEventListener("input",e=>{query=e.target.value;page="home";render()});
$$("[data-query]").forEach(b=>b.addEventListener("click",()=>{$("#searchInput").value=b.dataset.query;query=b.dataset.query;page="home";render()}));
$$(".main-tab").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.kind;page="home";taste="all";cafeType="all";setActive('[data-filter="taste"]',"data-value","all");setActive('[data-filter="cafeType']',"data-value","all");$$(".nav-btn").forEach(n=>n.classList.toggle("active",n.dataset.page==="home"));render()}));
$$("[data-filter]").forEach(b=>b.addEventListener("click",()=>{const type=b.dataset.filter;if(type==="taste")taste=b.dataset.value;else cafeType=b.dataset.value;setActive(`[data-filter="${type}"]`,"data-value",b.dataset.value);render()}));
$$("[data-walk]").forEach(b=>b.addEventListener("click",()=>{walkLimit=Number(b.dataset.walk);setActive("[data-walk]","data-walk",walkLimit);render()}));
$("#sortSelect").addEventListener("change",e=>{sort=e.target.value;render()});
$("#viewMode").addEventListener("change",e=>{compact=e.target.value==="compact";render()});
