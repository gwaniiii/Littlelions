
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>입맛지도 | 내 주변 맛집 탐색</title>

<style>
:root {
  --bg:#f7f8fa; --paper:#fff; --ink:#20242b;
  --muted:#7b8492; --line:#e7eaf0;
  --brand:#ff7043; --brand-dark:#e95b30;
  --brand-pale:#fff0ea; --shadow:0 8px 28px #1f29370b;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
.app { max-width:1100px; margin:auto; padding:20px 22px 100px; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
.brand { display:flex; align-items:center; gap:10px; font-size:23px; font-weight:950; letter-spacing:-1.1px; }
.brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:13px; background:var(--brand); color:white; font-size:21px; }
.brand em { color:var(--brand); font-style:normal; }
.origin { padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:white; font-size:12px; font-weight:700; }
.hero { padding:24px 0 20px; }
.kicker { font-size:11px; letter-spacing:1.6px; font-weight:900; color:var(--brand-dark); }
h1 { font-size:clamp(29px,5vw,43px); line-height:1.18; letter-spacing:-1.8px; margin:9px 0 10px; }
.hero p { margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
.search-panel { display:flex; align-items:center; gap:10px; background:white; border:1px solid var(--line); border-radius:17px; padding:8px 9px 8px 16px; box-shadow:var(--shadow); }
.search-symbol { font-size:21px; color:#8b95a4; }
#searchInput { flex:1; min-width:0; border:0; outline:0; padding:11px 0; font-size:14px; background:transparent; }
.search-btn { border:0; border-radius:12px; background:var(--brand); color:white; font-weight:800; padding:12px 17px; }
.quick-search { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 24px; }
.quick-search button,.filter-chip { border:1px solid var(--line); background:white; color:#56606e; border-radius:999px; padding:8px 12px; font-size:12px; font-weight:700; }
.main-tabs { display:flex; gap:8px; border-bottom:1px solid var(--line); margin:12px 0 20px; }
.main-tab { border:0; border-bottom:3px solid transparent; background:transparent; padding:14px 17px; color:var(--muted); font-weight:850; margin-bottom:-1px; }
.main-tab.active { color:var(--brand-dark); border-bottom-color:var(--brand); }
.content-layout { display:grid; grid-template-columns:245px minmax(0,1fr); gap:22px; align-items:start; }
.filters { background:white; border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); position:sticky; top:14px; }
.filter-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:17px; font-weight:900; }
.reset { border:0; background:transparent; color:var(--brand-dark); font-size:12px; font-weight:800; }
.filter-group { padding:15px 0; border-top:1px solid #f0f2f5; }
.filter-group:first-of-type { border-top:0; padding-top:0; }
.filter-title { font-size:12px; font-weight:900; margin-bottom:11px; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.filter-chip { padding:8px 10px; }
.filter-chip.active,.walk-btn.active { background:var(--brand-pale); border-color:#ffc7b5; color:#c84c26; }
.walk-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.walk-btn { padding:10px 3px; border:1px solid var(--line); border-radius:10px; background:white; color:#596273; font-size:12px; font-weight:800; }
.origin-note { font-size:11px; line-height:1.6; color:var(--muted); margin:12px 0 0; }
.results-top { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:1px 0 14px; }
.results-top h2 { font-size:20px; margin:0 0 5px; }
.results-sub { font-size:12px; color:var(--muted); }
.sort-select { border:1px solid var(--line); background:white; border-radius:10px; padding:9px 10px; font-size:12px; max-width:145px; }
.status-strip { border:1px solid #f3e0d7; background:#fff8f4; color:#795949; padding:12px 13px; border-radius:13px; font-size:11px; line-height:1.6; margin-bottom:15px; }
.results { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
.place-card { overflow:hidden; border:1px solid var(--line); border-radius:17px; background:white; box-shadow:0 3px 12px #1f293706; }
.card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 14px 0; }
.category-icon { display:grid; place-items:center; width:43px; height:43px; border-radius:13px; background:#fff0ea; font-size:22px; }
.save-btn { border:1px solid var(--line); background:white; border-radius:50%; width:34px; height:34px; font-size:18px; color:#89919e; }
.save-btn.saved { color:#ed5570; background:#fff1f3; }
.card-body { padding:12px 14px 14px; }
.place-name { font-size:16px; font-weight:900; margin:0 0 6px; }
.place-desc { font-size:12px; color:var(--muted); line-height:1.6; margin:0 0 12px; overflow-wrap:anywhere; }
.card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
.tag { background:#f3f5f8; color:#657080; border-radius:6px; padding:5px 7px; font-size:10px; font-weight:750; }
.card-foot { display:flex; flex-direction:column; gap:10px; border-top:1px solid #f0f2f5; padding-top:11px; }
.walk-label { font-size:11px; font-weight:800; color:#56606e; line-height:1.6; }
.card-actions { display:flex; gap:6px; flex-wrap:wrap; }
.action-link { text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:8px 9px; color:#4d5664; font-size:11px; font-weight:800; background:white; }
.action-link.primary { background:var(--brand); border-color:var(--brand); color:white; }
.empty { grid-column:1/-1; text-align:center; padding:40px 18px; border:1px dashed #dce1e8; background:white; border-radius:16px; color:var(--muted); line-height:1.8; }
.empty strong { display:block; color:var(--ink); font-size:15px; margin-bottom:4px; }
.bottom-nav { position:fixed; z-index:20; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,1100px); display:grid; grid-template-columns:repeat(3,1fr); padding:9px 12px calc(9px + env(safe-area-inset-bottom)); border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; background:#ffffffed; }
.nav-btn { border:0; background:transparent; color:#8a929e; font-size:11px; font-weight:750; padding:5px; }
.nav-btn span { display:block; font-size:20px; margin-bottom:3px; }
.nav-btn.active { color:var(--brand-dark); }
.hidden { display:none!important; }
#map { width:100%; height:260px; margin:0 0 16px; border-radius:14px; border:1px solid var(--line); }
@media(min-width:760px) { .results { grid-template-columns:repeat(3,minmax(0,1fr)); } .hero { padding-top:30px; } .app { padding-top:26px; } }
@media(max-width:680px) {
  .app { padding:14px 14px 92px; }
  .content-layout { grid-template-columns:1fr; gap:14px; }
  .filters { position:static; padding:15px; }
  .results { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .card-body { padding:10px; }
  .card-top { padding:10px 10px 0; }
  .place-name { font-size:14px; }
  .place-desc { font-size:11px; }
  .action-link { padding:7px; font-size:10px; }
  .origin { font-size:10px; padding:9px; }
  .hero { padding-top:20px; }
  .search-btn { padding:11px 12px; }
}
@media(max-width:390px) { .results { grid-template-columns:1fr; } .main-tab { padding:12px 13px; } }
</style>

<!-- 새 JavaScript 키를 입력해야 합니다. -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_새_JavaScript_키_붙여넣기&libraries=services"></script>
</head>

<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-mark">⌁</span><span>입맛<em>지도</em></span></div>
    <div class="origin">📍 동아백화점 쇼핑점 기준</div>
  </header>

  <section class="hero">
    <div class="kicker">FIND YOUR NEXT FAVORITE</div>
    <h1>오늘 어디서<br>뭐 먹지?</h1>
    <p>실제 장소를 검색하고,<br>마음에 드는 곳은 저장해 둬.</p>
  </section>

  <form class="search-panel" id="searchForm">
    <span class="search-symbol">⌕</span>
    <input id="searchInput" type="search" placeholder="가게명, 메뉴, 키워드 검색" autocomplete="off">
    <button class="search-btn" type="submit">검색</button>
  </form>

  <div class="quick-search">
    <button type="button" data-query="국밥"># 국밥</button>
    <button type="button" data-query="마라"># 마라</button>
    <button type="button" data-query="돈까스"># 돈까스</button>
    <button type="button" data-query="파스타"># 파스타</button>
    <button type="button" data-query="디저트"># 디저트</button>
    <button type="button" data-query="커피"># 커피</button>
  </div>

  <nav class="main-tabs">
    <button class="main-tab active" type="button" data-kind="food">🍽️ 음식점</button>
    <button class="main-tab" type="button" data-kind="cafe">☕ 카페</button>
  </nav>

  <div class="content-layout">
    <aside class="filters">
      <div class="filter-heading">필터 <button class="reset" id="resetFilters" type="button">초기화</button></div>

      <section class="filter-group">
        <div class="filter-title">어떤 느낌이 당겨?</div>
        <div class="chips" id="foodFilters">
          <button class="filter-chip active" type="button" data-term="">전체</button>
          <button class="filter-chip" type="button" data-term="매운 음식">🌶️ 매운맛</button>
          <button class="filter-chip" type="button" data-term="국물">🍲 국물</button>
          <button class="filter-chip" type="button" data-term="백반">🍚 든든함</button>
          <button class="filter-chip" type="button" data-term="돈까스">🍗 바삭함</button>
          <button class="filter-chip" type="button" data-term="덮밥">🍯 단짠단짠</button>
          <button class="filter-chip" type="button" data-term="파스타">🍋 파스타</button>
        </div>
        <div class="chips hidden" id="cafeFilters">
          <button class="filter-chip active" type="button" data-term="">전체</button>
          <button class="filter-chip" type="button" data-term="디저트 카페">🍰 디저트</button>
          <button class="filter-chip" type="button" data-term="분위기 좋은 카페">🌿 분위기</button>
          <button class="filter-chip" type="button" data-term="커피">☕ 음료</button>
          <button class="filter-chip" type="button" data-term="베이커리 카페">🥐 베이커리</button>
          <button class="filter-chip" type="button" data-term="조용한 카페">🤫 조용함</button>
          <button class="filter-chip" type="button" data-term="데이트 카페">💑 데이트</button>
        </div>
      </section>

      <section class="filter-group">
        <div class="filter-title">주변 검색 범위</div>
        <div class="walk-grid">
          <button class="walk-btn active" type="button" data-walk="700">10분 이내</button>
          <button class="walk-btn" type="button" data-walk="1400">20분 이내</button>
          <button class="walk-btn" type="button" data-walk="2100">30분 이내</button>
        </div>
        <p class="origin-note">출발점: 동아백화점 쇼핑점<br>※ 거리를 기준으로 도보 시간을 추정해. 실제 경로와 다를 수 있어.</p>
      </section>

      <section class="filter-group">
        <div class="filter-title">정렬</div>
        <select id="sortSelect" class="sort-select" style="width:100%">
          <option value="distance">가까운 순</option>
          <option value="name">가게명순</option>
        </select>
      </section>
    </aside>

    <main>
      <div class="results-top">
        <div>
          <h2 id="resultsTitle">주변 음식점</h2>
          <div class="results-sub" id="resultSummary">실제 장소를 검색할게.</div>
        </div>
      </div>

      <div class="status-strip" id="statusText" role="status">
        카카오 장소 정보를 불러오는 중이야.
      </div>
      <div id="map"></div>
      <section class="results" id="results" aria-live="polite"></section>
    </main>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" type="button" data-page="home"><span>⌂</span>탐색</button>
  <button class="nav-btn" type="button" data-page="saved"><span>♡</span>찜 목록</button>
  <button class="nav-btn" type="button" data-page="random"><span>⤨</span>랜덤 추천</button>
</nav>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const originAddress = "대구광역시 중구 달구벌대로 2085";
  const resultsRoot = $("#results");
  const statusText = $("#statusText");

  let map, places, geocoder, origin = null;
  let kind = "food";
  let term = "";
  let query = "";
  let radius = 700;
  let page = "home";
  let sort = "distance";
  let allPlaces = [];
  let saved = [];

  try {
    saved = JSON.parse(localStorage.getItem("ipmat-saved-v2") || "[]");
    if (!Array.isArray(saved)) saved = [];
  } catch (e) { saved = []; }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function setStatus(message) {
    statusText.textContent = message;
  }

  function setActive(selector, value) {
    $$(selector).forEach(button =>
      button.classList.toggle("active", button.dataset.term === value)
    );
  }

  function estimateMeters(place) {
    if (place.distance !== undefined && place.distance !== "") {
      return Number(place.distance);
    }
    if (!origin) return Infinity;

    const lat1 = origin.getLat() * Math.PI / 180;
    const lat2 = Number(place.y) * Math.PI / 180;
    const dLat = lat2 - lat1;
    const dLng = (Number(place.x) - origin.getLng()) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
      Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function searchPlaces() {
    if (!origin || !places) return;

    resultsRoot.innerHTML =
      '<div class="empty"><strong>검색 중이야!</strong>주변 장소를 불러오고 있어.</div>';

    const keyword = query.trim() || term.trim();

    if (keyword) {
      const searchWord = keyword + (kind === "cafe" ? " 카페" : " 음식점");
      places.keywordSearch(searchWord, handleResults, {
        location: origin,
        radius: 2500,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    } else {
      const categoryCode = kind === "cafe" ? "CE7" : "FD6";
      places.categorySearch(categoryCode, handleResults, {
        location: origin,
        radius: 2500,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    }
  }

  function handleResults(data, status) {
    if (status !== kakao.maps.services.Status.OK &&
        status !== kakao.maps.services.Status.ZERO_RESULT) {
      allPlaces = [];
      resultsRoot.innerHTML =
        '<div class="empty"><strong>검색에 실패했어.</strong>JavaScript 키와 도메인 등록 상태를 확인해 줘.</div>';
      $("#resultSummary").textContent = "검색 결과를 불러오지 못했어.";
      setStatus("장소 검색에 실패했어. 카카오 개발자 설정과 JavaScript 키를 확인해 줘.");
      return;
    }

    allPlaces = (data || []).map(p => ({
      ...p,
      meters: estimateMeters(p),
      id: String(p.id),
      kind
    }));

    render();
    setStatus("카카오 장소 검색 결과야. 거리와 도보 시간은 위치를 바탕으로 계산한 추정치야.");
  }

  function render() {
    $("#foodFilters").classList.toggle("hidden", kind !== "food");
    $("#cafeFilters").classList.toggle("hidden", kind !== "cafe");

    $$(".main-tab").forEach(b =>
      b.classList.toggle("active", b.dataset.kind === kind)
    );

    $("#resultsTitle").textContent =
      page === "saved" ? "내가 찜한 장소" :
      page === "random" ? "랜덤 추천" :
      kind === "food" ? "주변 음식점" : "주변 카페";

    let list = allPlaces.filter(p => p.meters <= radius);

    if (page === "saved") {
      list = list.filter(p => saved.includes(p.id));
    }

    if (sort === "name") {
      list.sort((a,b) => a.place_name.localeCompare(b.place_name, "ko"));
    } else {
      list.sort((a,b) => a.meters - b.meters);
    }

    if (page === "random" && list.length) {
      list = [list[Math.floor(Math.random() * list.length)]];
    }

    $("#resultSummary").textContent =
      `${list.length}개 장소 · 반경 약 ${radius}m`;

    if (!list.length) {
      resultsRoot.innerHTML =
        '<div class="empty"><strong>조건에 맞는 장소가 없어.</strong>검색어를 바꾸거나 주변 검색 범위를 넓혀 봐.</div>';
      return;
    }

    resultsRoot.innerHTML = list.map(p => {
      const id = escapeHtml(p.id);
      const name = escapeHtml(p.place_name);
      const address = escapeHtml(p.road_address_name || p.address_name || "주소 정보 없음");
      const category = escapeHtml((p.category_name || "").split(" > ").slice(-1)[0]);
      const phone = p.phone ? `☎ ${escapeHtml(p.phone)}` : "전화번호 정보 없음";
      const distance = Math.round(p.meters);
      const walkMinutes = Math.max(1, Math.round(distance / 67));
      const isSaved = saved.includes(p.id);
      const kakaoUrl = p.place_url ||
        `https://map.kakao.com/link/search/${encodeURIComponent(p.place_name)}`;
      const naverUrl =
        `https://map.naver.com/p/search/${encodeURIComponent(p.place_name + " " + (p.road_address_name || p.address_name || ""))}`;

      return `
        <article class="place-card">
          <div class="card-top">
            <div class="category-icon">${kind === "cafe" ? "☕" : "🍽️"}</div>
            <button type="button" class="save-btn ${isSaved ? "saved" : ""}"
              data-save="${id}" aria-label="찜하기">${isSaved ? "♥" : "♡"}</button>
          </div>
          <div class="card-body">
            <h3 class="place-name">${name}</h3>
            <p class="place-desc">${address}</p>
            <div class="card-tags">
              ${category ? `<span class="tag">${category}</span>` : ""}
              <span class="tag">${phone}</span>
            </div>
            <div class="card-foot">
              <span class="walk-label">📍 약 ${distance}m · 🚶 도보 약 ${walkMinutes}분(추정)</span>
              <div class="card-actions">
                <a class="action-link" href="${escapeHtml(kakaoUrl)}" target="_blank" rel="noopener">장소 정보 ↗</a>
                <a class="action-link primary" href="${escapeHtml(naverUrl)}" target="_blank" rel="noopener">지도·길찾기 ↗</a>
              </div>
            </div>
          </div>
        </article>`;
    }).join("");
  }

  function initMap() {
    if (!window.kakao || !kakao.maps || !kakao.maps.services) {
      setStatus("카카오 지도 SDK를 불러오지 못했어. JavaScript 키와 등록 도메인을 확인해 줘.");
      resultsRoot.innerHTML =
        '<div class="empty"><strong>지도 연결이 필요해.</strong>JavaScript 키를 코드에 넣었는지 확인해 줘.</div>';
      return;
    }

    map = new kakao.maps.Map($("#map"), {
      center: new kakao.maps.LatLng(35.8714, 128.6014),
      level: 5
    });
    places = new kakao.maps.services.Places();
    geocoder = new kakao.maps.services.Geocoder();

    geocoder.addressSearch(originAddress, (data, status) => {
      if (status !== kakao.maps.services.Status.OK || !data.length) {
        setStatus("출발점 주소를 확인하지 못했어. 주소 검색이 가능한지 확인해 줘.");
        return;
      }

      origin = new kakao.maps.LatLng(Number(data[0].y), Number(data[0].x));
      map.setCenter(origin);

      new kakao.maps.Marker({
        map,
        position: origin,
        title: "동아백화점 쇼핑점"
      });

      searchPlaces();
    });
  }

  $("#searchForm").addEventListener("submit", e => {
    e.preventDefault();
    query = $("#searchInput").value.trim();
    term = "";
    page = "home";
    $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === page));
    searchPlaces();
  });

  $("#searchInput").addEventListener("input", e => {
    query = e.target.value.trim();
    term = "";
    page = "home";
    if (query.length === 0 || query.length >= 2) searchPlaces();
  });

  $$("[data-query]").forEach(button => {
    button.addEventListener("click", () => {
      query = button.dataset.query;
      term = "";
      $("#searchInput").value = query;
      page = "home";
      searchPlaces();
    });
  });

  $$(".main-tab").forEach(button => {
    button.addEventListener("click", () => {
      kind = button.dataset.kind;
      query = "";
      term = "";
      $("#searchInput").value = "";
      page = "home";
      setActive("#foodFilters [data-term]", "");
      setActive("#cafeFilters [data-term]", "");
      $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === page));
      searchPlaces();
    });
  });

  $$("[data-term]").forEach(button => {
    button.addEventListener("click", () => {
      term = button.dataset.term;
      query = "";
      $("#searchInput").value = "";
      setActive(kind === "food" ? "#foodFilters [data-term]" : "#cafeFilters [data-term]", term);
      page = "home";
      searchPlaces();
    });
  });

  $$("[data-walk]").forEach(button => {
    button.addEventListener("click", () => {
      radius = Number(button.dataset.walk);
      $$(".walk-btn").forEach(b => b.classList.toggle("active", b === button));
      render();
    });
  });

  $("#sortSelect").addEventListener("change", e => {
    sort = e.target.value;
    render();
  });

  $("#resetFilters").addEventListener("click", () => {
    kind = "food";
    term = "";
    query = "";
    radius = 700;
    sort = "distance";
    page = "home";
    $("#searchInput").value = "";
    $("#sortSelect").value = "distance";
    $$(".walk-btn").forEach(b => b.classList.toggle("active", b.dataset.walk === "700"));
    setActive("#foodFilters [data-term]", "");
    setActive("#cafeFilters [data-term]", "");
    $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === "home"));
    searchPlaces();
  });

  $$(".nav-btn").forEach(button => {
    button.addEventListener("click", () => {
      page = button.dataset.page;
      $$(".nav-btn").forEach(b => b.classList.toggle("active", b === button));

      if (page === "random") {
        const list = allPlaces.filter(p => p.meters <= radius);
        if (!list.length) {
          alert("현재 조건에 맞는 장소가 없어. 검색 범위를 넓혀 봐!");
          page = "home";
        }
      }
      render();
    });
  });

  $("#results").addEventListener("click", e => {
    const button = e.target.closest("[data-save]");
    if (!button) return;

    const id = button.dataset.save;
    saved = saved.includes(id)
      ? saved.filter(x => x !== id)
      : [...saved, id];

    try {
      localStorage.setItem("ipmat-saved-v2", JSON.stringify(saved));
    } catch (err) {}

    render();
  });

  initMap();
})();
</script>
</body>
</html>
