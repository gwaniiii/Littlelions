
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>입맛지도 | 오늘, 뭐가 당겨?</title>
  <style>
    :root {
      --bg: #fffaf4;
      --paper: #ffffff;
      --ink: #30271f;
      --muted: #8e8176;
      --accent: #e77d4d;
      --accent-light: #fff0e6;
      --line: #f0e7dd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
    }

    button { font: inherit; cursor: pointer; }

    .app {
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 25px 20px 100px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1.2px;
    }

    .logo span { color: var(--accent); }

    .location {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: white;
      font-size: 12px;
    }

    .hero { margin-bottom: 25px; }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 9px 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.2;
      letter-spacing: -2px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 28px 0 24px;
    }

    .main-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      color: var(--ink);
      text-align: left;
      transition: .2s;
    }

    .main-tab.active {
      border-color: var(--accent);
      background: var(--accent-light);
      box-shadow: 0 4px 14px #e77d4d14;
    }

    .tab-icon { font-size: 28px; }

    .tab-title {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .tab-desc {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .section-title {
      margin: 27px 0 13px;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .chip {
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: white;
      color: #675b51;
      font-size: 13px;
      transition: .2s;
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      font-weight: 750;
    }

    .walk-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .walk-btn {
      padding: 13px 5px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--ink);
    }

    .walk-btn.active {
      border-color: var(--accent);
      background: var(--accent-light);
      color: #a84e27;
      font-weight: 800;
    }

    .walk-btn strong {
      display: block;
      font-size: 16px;
    }

    .walk-btn small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 31px 0 14px;
    }

    .results-head h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.6px;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .notice {
      margin-bottom: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #f5eee6;
      color: #786759;
      font-size: 11px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: white;
    }

    .card-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 120px;
      aspect-ratio: 1.35;
      background: linear-gradient(135deg, #f9e5d4, #f5f0e7);
      font-size: 48px;
    }

    .card:nth-child(3n + 2) .card-visual {
      background: linear-gradient(135deg, #f8e8e7, #f6e9d9);
    }

    .card:nth-child(3n) .card-visual {
      background: linear-gradient(135deg, #e9eddf, #f6ecd9);
    }

    .demo-label {
      position: absolute;
      left: 9px;
      top: 9px;
      padding: 5px 7px;
      border-radius: 20px;
      background: #ffffffdf;
      color: #766458;
      font-size: 9px;
      font-weight: 750;
    }

    .heart {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      border: 0;
      border-radius: 50%;
      background: #ffffffed;
      color: #8f8178;
      font-size: 19px;
    }

    .heart.saved { color: #e45d6e; }

    .card-content { padding: 12px; }

    .card-name {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -.4px;
    }

    .card-desc {
      min-height: 34px;
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    .tag {
      padding: 4px 7px;
      border-radius: 6px;
      background: #f8f2eb;
      color: #806c5c;
      font-size: 10px;
    }

    .card-meta {
      padding-top: 9px;
      border-top: 1px solid #f5eee7;
      color: #6c5a4d;
      font-size: 11px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 32px 15px;
      border: 1px dashed var(--line);
      border-radius: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 50%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: min(100%, 760px);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border-top: 1px solid var(--line);
      background: #fffaf4f5;
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      padding: 7px 3px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
    }

    .nav-btn span {
      display: block;
      margin-bottom: 4px;
      font-size: 20px;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 850;
    }

    .hidden { display: none !important; }

    @media (min-width: 600px) {
      .app { padding-top: 38px; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card-visual { min-height: 145px; }
    }

    @media (max-width: 360px) {
      .app { padding-right: 13px; padding-left: 13px; }
      .main-tab { padding: 13px 9px; gap: 7px; }
      .tab-title { font-size: 15px; }
      .chip { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="logo">입맛<span>지도.</span></div>
      <div class="location">📍 동아백화점 쇼핑점</div>
    </header>

    <section class="hero">
      <div class="eyebrow">YOUR LOCAL FOOD GUIDE</div>
      <h1>오늘,<br>뭐가 당겨?</h1>
      <p class="subtitle">
        고민은 줄이고, 맛있는 발견은 늘리고.<br>
        오늘의 입맛에 맞는 장소를 찾아보자.
      </p>
    </section>

    <section class="main-tabs" aria-label="장소 종류">
      <button class="main-tab active" data-kind="food">
        <span class="tab-icon">🍜</span>
        <span>
          <span class="tab-title">음식</span>
          <span class="tab-desc">지금 당기는 맛</span>
        </span>
      </button>
      <button class="main-tab" data-kind="cafe">
        <span class="tab-icon">☕</span>
        <span>
          <span class="tab-title">카페</span>
          <span class="tab-desc">디저트와 분위기</span>
        </span>
      </button>
    </section>

    <section id="foodFilters">
      <h2 class="section-title">어떤 맛이 당겨?</h2>
      <div class="chips" id="foodChips">
        <button class="chip active" data-value="all">✨ 전체</button>
        <button class="chip" data-value="단짠단짠">🍯 단짠단짠</button>
        <button class="chip" data-value="매운맛">🌶️ 매운맛</button>
        <button class="chip" data-value="국물">🍲 국물</button>
        <button class="chip" data-value="든든함">🍚 든든함</button>
        <button class="chip" data-value="바삭함">🍗 바삭함</button>
        <button class="chip" data-value="새콤달콤">🍋 새콤달콤</button>
      </div>
    </section>

    <section id="cafeFilters" class="hidden">
      <h2 class="section-title">어떤 카페를 찾고 있어?</h2>
      <div class="chips" id="cafeTypeChips">
        <button class="chip active" data-value="all">✨ 전체</button>
        <button class="chip" data-value="디저트">🍰 디저트</button>
        <button class="chip" data-value="분위기">🌿 분위기</button>
        <button class="chip" data-value="음료">☕ 음료</button>
      </div>
      <div id="cafeDetailWrap">
        <h2 class="section-title">더 자세히 골라볼까?</h2>
        <div class="chips" id="cafeDetailChips">
          <button class="chip active" data-value="all">전체</button>
          <button class="chip" data-value="케이크">케이크</button>
          <button class="chip" data-value="베이커리">베이커리</button>
          <button class="chip" data-value="커피">커피</button>
          <button class="chip" data-value="감성">감성적인 곳</button>
          <button class="chip" data-value="데이트">데이트</button>
          <button class="chip" data-value="조용함">조용한 곳</button>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">얼마나 걸을까?</h2>
      <div class="walk-options">
        <button class="walk-btn active" data-walk="10">
          <strong>🚶 10분</strong><small>가까운 곳</small>
        </button>
        <button class="walk-btn" data-walk="20">
          <strong>🚶 20분</strong><small>선택의 폭 넓게</small>
        </button>
        <button class="walk-btn" data-walk="30">
          <strong>🥾 30분</strong><small>맛집 원정</small>
        </button>
      </div>
    </section>

    <section>
      <div class="results-head">
        <h2 id="resultsTitle">오늘의 음식</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="notice">
        🧪 체험용 예시 데이터입니다. 실제 식당명·거리·영업 정보는 아직 연결되지 않았어요.
      </div>
      <div class="cards" id="results"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button class="nav-btn active" data-page="home">
      <span>⌂</span>홈
    </button>
    <button class="nav-btn" data-page="saved">
      <span>♡</span>찜 목록
    </button>
    <button class="nav-btn" data-page="random">
      <span>⤨</span>골라줘
    </button>
  </nav>

  <script>
    const places = [
      {id:1, kind:"food", name:"불꽃 떡볶이", icon:"🌶️",
       desc:"매콤달콤한 소스와 쫄깃한 떡",
       tags:["매운맛","단짠단짠"], walk:7, price:"가격 정보 없음"},
      {id:2, kind:"food", name:"따끈 국밥", icon:"🍲",
       desc:"든든하게 즐기는 따뜻한 한 끼",
       tags:["국물","든든함"], walk:9, price:"가격 정보 없음"},
      {id:3, kind:"food", name:"바삭 치킨", icon:"🍗",
       desc:"바삭한 튀김과 달콤짭짤한 맛",
       tags:["바삭함","단짠단짠"], walk:14, price:"가격 정보 없음"},
      {id:4, kind:"food", name:"얼큰 짬뽕", icon:"🍜",
       desc:"얼큰한 국물과 푸짐한 건더기",
       tags:["매운맛","국물","든든함"], walk:18, price:"가격 정보 없음"},
      {id:5, kind:"food", name:"든든 덮밥", icon:"🍚",
       desc:"한 그릇으로 간편하고 든든하게",
       tags:["든든함","단짠단짠"], walk:24, price:"가격 정보 없음"},
      {id:6, kind:"food", name:"새콤 비빔면", icon:"🍋",
       desc:"입맛을 깨우는 새콤매콤한 한 그릇",
       tags:["새콤달콤","매운맛"], walk:28, price:"가격 정보 없음"},
      {id:7, kind:"cafe", name:"달콤 케이크", icon:"🍰",
       desc:"달콤한 케이크와 여유로운 시간",
       tags:["디저트","케이크","감성","데이트"], walk:8, price:"가격 정보 없음"},
      {id:8, kind:"cafe", name:"향긋한 커피", icon:"☕",
       desc:"커피 향과 함께하는 짧은 휴식",
       tags:["음료","커피","조용함"], walk:12, price:"가격 정보 없음"},
      {id:9, kind:"cafe", name:"감성 베이커리", icon:"🥐",
       desc:"갓 구운 빵과 따뜻한 공간",
       tags:["디저트","베이커리","감성"], walk:17, price:"가격 정보 없음"},
      {id:10, kind:"cafe", name:"데이트 카페", icon:"🧁",
       desc:"달콤한 디저트와 아늑한 분위기",
       tags:["디저트","분위기","데이트","케이크"], walk:22, price:"가격 정보 없음"},
      {id:11, kind:"cafe", name:"조용한 찻집", icon:"🍵",
       desc:"차 한 잔과 차분한 휴식",
       tags:["음료","분위기","조용함"], walk:27, price:"가격 정보 없음"}
    ];

    let kind = "food";
    let foodTag = "all";
    let cafeType = "all";
    let cafeDetail = "all";
    let walkLimit = 10;
    let page = "home";
    let saved = [];

    try {
      saved = JSON.parse(localStorage.getItem("ipmat-saved") || "[]");
      if (!Array.isArray(saved)) saved = [];
    } catch (error) {
      saved = [];
    }

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    function setActive(container, value) {
      $$(container + " .chip").forEach(button => {
        button.classList.toggle("active", button.dataset.value === value);
      });
    }

    function getFilteredPlaces() {
      let list = places.filter(place => place.kind === kind);

      if (kind === "food" && foodTag !== "all") {
        list = list.filter(place => place.tags.includes(foodTag));
      }

      if (kind === "cafe" && cafeType !== "all") {
        list = list.filter(place => place.tags.includes(cafeType));
      }

      if (kind === "cafe" && cafeDetail !== "all") {
        list = list.filter(place => place.tags.includes(cafeDetail));
      }

      list = list.filter(place => place.walk <= walkLimit);

      if (page === "saved") {
        list = list.filter(place => saved.includes(place.id));
      }

      return list;
    }

    function render() {
      $("#foodFilters").classList.toggle("hidden", kind !== "food");
      $("#cafeFilters").classList.toggle("hidden", kind !== "cafe");

      $("#resultsTitle").textContent = page === "saved"
        ? "내가 찜한 장소"
        : page === "random" ? "오늘의 추천 후보" :
        kind === "food" ? "오늘의 음식" : "오늘의 카페";

      const list = getFilteredPlaces();
      $("#resultCount").textContent = list.length + "개";

      const results = $("#results");

      if (list.length === 0) {
        results.innerHTML = `
          <div class="empty">
            ${page === "saved"
              ? "아직 찜한 장소가 없어.<br>마음에 드는 카드를 눌러 저장해 봐!"
              : "선택한 조건에 맞는 예시가 없어.<br>거리나 취향을 바꿔 봐!"}
          </div>`;
        return;
      }

      let displayList = list;

      if (page === "random") {
        displayList = [list[Math.floor(Math.random() * list.length)]];
      }

      results.innerHTML = displayList.map(place => `
        <article class="card">
          <div class="card-visual">
            <span class="demo-label">예시 데이터</span>
            <span>${place.icon}</span>
            <button class="heart ${saved.includes(place.id) ? "saved" : ""}"
              data-save="${place.id}"
              aria-label="찜 ${place.name}">
              ${saved.includes(place.id) ? "♥" : "♡"}
            </button>
          </div>
          <div class="card-content">
            <h3 class="card-name">${place.name}</h3>
            <p class="card-desc">${place.desc}</p>
            <div class="tags">
              ${place.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
            </div>
            <div class="card-meta">
              🚶 예시 ${place.walk}분 · ${place.price}
            </div>
          </div>
        </article>
      `).join("");
    }

    $$(".main-tab").forEach(button => {
      button.addEventListener("click", () => {
        kind = button.dataset.kind;
        page = "home";
        $$(".main-tab").forEach(tab =>
          tab.classList.toggle("active", tab === button));
        $$(".nav-btn").forEach(nav =>
          nav.classList.toggle("active", nav.dataset.page === "home"));
        render();
      });
    });

    $$("#foodChips .chip").forEach(button => {
      button.addEventListener("click", () => {
        foodTag = button.dataset.value;
        setActive("#foodChips", foodTag);
        render();
      });
    });

    $$("#cafeTypeChips .chip").forEach(button => {
      button.addEventListener("click", () => {
        cafeType = button.dataset.value;
        setActive("#cafeTypeChips", cafeType);
        render();
      });
    });

    $$("#cafeDetailChips .chip").forEach(button => {
      button.addEventListener("click", () => {
        cafeDetail = button.dataset.value;
        setActive("#cafeDetailChips", cafeDetail);
        render();
      });
    });

    $$(".walk-btn").forEach(button => {
      button.addEventListener("click", () => {
        walkLimit = Number(button.dataset.walk);
        $$(".walk-btn").forEach(item =>
          item.classList.toggle("active", item === button));
        render();
      });
    });

    $$(".nav-btn").forEach(button => {
      button.addEventListener("click", () => {
        page = button.dataset.page;

        if (page === "random") {
          // 현재 음식/카페와 거리 조건 안에서 무작위로 선택
        }

        $$(".nav-btn").forEach(nav =>
          nav.classList.toggle("active", nav === button));

        render();
      });
    });

    $("#results").addEventListener("click", event => {
      const button = event.target.closest("[data-save]");
      if (!button) return;

      const id = Number(button.dataset.save);

      saved = saved.includes(id)
        ? saved.filter(item => item !== id)
        : [...saved, id];

      try {
        localStorage.setItem("ipmat-saved", JSON.stringify(saved));
      } catch (error) {
        // 저장 기능을 사용할 수 없는 환경에서도 화면은 작동
      }

      render();
    });

    render();
  </script>
</body>
</html>
